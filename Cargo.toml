[package]
name = "anonym-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server that masks sensitive values in files before an AI agent sees them, and restores them on write"
license = "MIT"
repository = "https://github.com/srknkrbb/anonym-mcp"
readme = "README.md"
keywords = ["mcp", "privacy", "anonymization", "pii", "redaction"]
categories = ["command-line-utilities"]

[[bin]]
name = "anonym-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.9"

# Vision OCR is an Apple framework, so image and scanned-PDF support exists
# only on macOS. Everything else works everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSDictionary", "NSGeometry"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true
